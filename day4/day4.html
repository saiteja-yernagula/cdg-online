    <!-- 
    
    tags are divided based on the behaviour
    1) block level elements
    are the elements which always starts on new line and occupies total space
    h1,p,ul,li

    div is block level element
    it is used to group the tags for applying styles


    2) inline elements
    are the elements which doesnt starts on new line and occupies neccessary space
    img , a 
    span is inline element
    it is used to group the text for applying styles


    div and span
    -->
