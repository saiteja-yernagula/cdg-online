<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

/*
shallow copy
references are copied not the only values
 let a=['html','css','js']
        let b=a;
        b[0]='react'

        console.log(b)
        console.log(a)

deep copy
values are copied not the refernce
to create the deepy copy of array and object we need spread operator
spread the values of iterable - strings,object,arrays
it is also used for merging 
*/
        let a=['html','css','js']
        let b=[...a];
        b[0]='react'
        console.log(b)
        console.log(a)

        let obj1={name:'jessy'}
        let obj2={age:25}
        let obj3={...obj1,...obj2,city:'vizag'}
        console.log(obj3)

        let frontend=['html','css']
        let backend=['springboot','flask']
        let fullstack=[...frontend,...backend,'react']
        console.log(fullstack)
        
        let str='hello world'
        let newstr=[...str]
        console.log(newstr)

        let products=[
            {name:'laptop',price:60000,rating:4.5},
            {name:'Samsung',price:25000,rating:4.2},
            {name:'oneplus earbuds',price:2000,rating:4.8},
            {name:'keyboard',price:1500,rating:3.9},
            {name:'smartwatch',price:8000,rating:4.6}
        ]
        let updatedproducts=products.map((val)=>{
          return {...val,discountedprice:val.price*0.9,dealer:'john'}
        })
        console.log(updatedproducts)

        let highratedproducts=updatedproducts.filter((val,ind)=>{
           return val.rating>=4.5
        })
        console.log(highratedproducts)

        let sortbyrating=[...updatedproducts].sort((a,b)=>{
           return b.rating-a.rating
        })
        console.log(sortbyrating)

        let sortbyprice=[...updatedproducts].sort((a,b)=>{
            return a.price-b.price
        })
        console.log(sortbyprice)

        let total=products.reduce((acc,val)=>{
            return acc+val.price
        },0)
        console.log(total)

        let count=products.reduce((acc,val)=>{
            return acc+1
        },0)
        console.log(count)


        // // how to sent the data to the local storage
        let name='prudhvi'
        localStorage.setItem('cdgstudent',name)

        //how to get that data from the localstorage
        let data=localStorage.getItem('cdgstudent')
        console.log(data)

        // how to sent array of object
        // JSON.stringigy- it is used to convert the js data into json data
        localStorage.setItem('products',JSON.stringify(products))

        //JSON.parse()-it is used to convert the json data into js data
        let productsdata=JSON.parse(localStorage.getItem('products'))
        console.log(productsdata)

    </script>

</body>
</html>
