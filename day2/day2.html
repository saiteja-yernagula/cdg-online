    <!--
    comments
    ctrl / 
    it is used to create the documentation of code
    it wont be executed

    image tag
    anchor tag
    table tags

    image tag
    it is used to add image to the html page

    1) absolute url
    it means the complete resource url 
    <img src="" alt="">


    attributes - it provides the extra information about an element and controls the element
    src---resource url
    alt --alternative text 
    width 
    height 

    disadvantages
    1) external dependency
    2) copyrights 
    3) long urls


    2) relative url
    it was the resource that located at local project folder
    
    short url
    no copyright
    no dependency


    
     -->
    <img src="" alt="">

    <!-- 
    anchor tag
    it is used for internal routing and external routing
    it is used for navigation

    external routing-absolute
    <a href="https://en.wikipedia.org/wiki/HTML">html</a>
    
    a -anchor tag
    href- hyper refernce -  resource link
    target

    external routing-relative
   <a href="contact.html">contact</a>

   it specifies where the resource should be opened
   target='_self'
   target='_blank'
    
    -->
    <a href="https://en.wikipedia.org/wiki/HTML">html</a>
    <a href="https://en.wikipedia.org/wiki/CSS">Css</a>
