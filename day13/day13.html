<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        flex-one dimensional layout
        grid
        grid is a two dimensional layout model that is used to create complex 
        layouts

        grid container
       1) display:grid
        it will create the grid container

        2)grid-template-columns
        it defines the no of columns and size of the each column
        grid-template-columns: 50px 60px 70px 80px;

        3)gap
        it creaates a space
        gap:20px

        4)grid-template-rows:100px 200px 300px
        5) justify-content
        6) align-content

        grid items


        */
        .parent{
            border:2px solid blue;
            height:90vh;
            display:grid;
            grid-template-columns: 20% 30% 40%;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-columns: 50px 60px 70px 80px;
        grid-template-rows:100px 200px 250px;

        gap:20px;
        justify-content:center;
        align-content:center;
        }


        .child{
            background:lightseagreen;
            border:2px solid black;
            padding:6px;
        }
        .container{
            height:80vh;
            display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .b1{
            grid-column:1/2;
            grid-row:1/4;
        }
        .b2{
           grid-column:2/4;
            grid-row:1/2; 
        }
        .b8{
            grid-column:4/5;
            grid-row:2/4;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">child1</div>
        <div class="child">child2</div>
        <div class="child">child3</div>
        <div class="child">child4</div>
        <div class="child">child5</div>
        <div class="child">child6</div>
        <div class="child">child7</div>
        <div class="child">child8</div>
        <div class="child">child9</div>
    </div>
    
     <div class="container">
        <div class="child b1">box 1</div>
        <div class="child b2">box 2</div>
        <div class="child b3">box 3</div>
        <div class="child b4">box 4</div>
        <div class="child b5">box 5</div>
        <div class="child b6">box 6</div>
        <div class="child b7">box 7</div>
        <div class="child b8">box 8</div>
    </div>

    
</body>
</html>
