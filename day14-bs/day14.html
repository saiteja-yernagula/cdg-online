    framework- collection pre defined code

    Bootstrap
    bootstrap is css framework that used to create responsive
    mobile first websites

    how to integrate bootstrap
    1) using cdn
       search bootstrap 5 cdn  
       copy and paste the css link head section
       copy and paste the script link at the above of the closing body tag
       <h1 class='bg-primary'>container</h1>
    2) using download
    3) npm install bootstrap


    html is full of tags and elements
    css is full of properties

   3)
   text-end
   text-center
   text-start

      a) content
         width and height
